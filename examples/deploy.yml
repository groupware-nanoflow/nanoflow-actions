# Este es el archivo que NanoFlow escribe en el repositorio del cliente, en
# .github/workflows/deploy.yml. Son veinte líneas porque todo lo demás vive en
# el workflow reutilizable.
name: Deploy

on:
  push:
    branches: [develop, stage, main]
  workflow_dispatch:

# Dos despliegues seguidos sobre la misma rama se encolan en vez de pisarse.
# Sin cancel-in-progress: cortar un apply a la mitad deja infraestructura en un
# estado que nadie eligió.
concurrency:
  group: nanoflow-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Obligatorio. id-token: write deja al job pedir su token OIDC, con el que
    # NanoFlow entrega las credenciales, recibe el log en vivo y registra el
    # despliegue. Un workflow reutilizable solo puede usar los permisos que le
    # concede quien lo llama: sin esta línea, falla antes de empezar.
    permissions:
      contents: read
      id-token: write
    uses: groupware-nanoflow/nanoflow-actions/.github/workflows/deploy-aws.yml@v1
    with:
      api-url: https://devapi-nanoflow.groupware.com.co
      audience: nanoflow-dev
      # live-logs: false   # para no reenviar la salida de build y deploy
