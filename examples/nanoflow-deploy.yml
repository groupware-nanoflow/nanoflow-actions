# .nanoflow/deploy.yml — cómo se construye y se despliega este repositorio.
#
# NanoFlow aporta la identidad (credenciales temporales en la cuenta AWS del
# ambiente) y la trazabilidad. Cómo se despliega lo decide el proyecto, porque
# el agente genera aplicaciones reales y no tres plantillas fijas.
version: 1

toolchain:
  node: "22"
  # go: "1.25"
  # python: "3.12"

build: pnpm install --frozen-lockfile && pnpm build

deploy: |
  terraform init -input=false
  terraform apply -auto-approve

# Opcional: la URL pública de lo desplegado. NanoFlow la muestra junto al
# despliegue cuando sale bien.
url: https://dev.app.example.com

# Opcional: variables de entorno de los pasos cuyos valores se tapan en el log
# en vivo antes de salir del runner. Las credenciales de AWS se tapan siempre.
# mask-env: [DB_PASSWORD, STRIPE_KEY]

# Opcional: las bases Postgres de las que este repo es dueño (data[].owner).
# Se migran después del build y antes del deploy; ver README «Bases Postgres».
# databases:
#   - name: app-db
#     migrations: db/migrations

# Opcional: un ambiente puede sobrescribir build, deploy y url (y sumar
# mask-env). Se resuelve después de que NanoFlow decide el ambiente a partir de
# la rama.
environments:
  production:
    url: https://app.example.com
    deploy: |
      terraform init -input=false
      terraform apply -auto-approve -var-file=prod.tfvars
