name: NanoFlow Azure credentials
description: >
  Autoriza el despliegue con NanoFlow y deja el job dentro de la suscripción de
  Azure del ambiente al que despliega esta rama (doc 40 de la consola, §24). El
  job NO elige el ambiente: lo deriva NanoFlow de la rama, que viene firmada
  por GitHub dentro del token. A diferencia de AWS, NanoFlow no entrega
  credenciales: responde solo identificadores (directorio, suscripción y la
  identidad de despliegue de ESTE repositorio), y el job entra a Azure
  canjeando su propio token OIDC por esa identidad, que solo confía en este
  repositorio y este ambiente. Aquí no hay ningún secreto guardado.

inputs:
  api-url:
    description: Base del API de NanoFlow, p. ej. https://devapi-nanoflow.groupware.com.co
    required: true
  audience:
    description: Audiencia que se le pide a GitHub para hablar con NanoFlow, p. ej. nanoflow-dev. Sin valor por defecto a propósito.
    required: true

outputs:
  environment:
    description: Ambiente que NanoFlow resolvió para esta rama
    value: ${{ steps.authorize.outputs.environment }}
  subscription-id:
    description: Suscripción de Azure del ambiente
    value: ${{ steps.authorize.outputs.subscription-id }}
  tenant-id:
    description: Directorio de Entra ID de la suscripción
    value: ${{ steps.authorize.outputs.tenant-id }}
  client-id:
    description: Id de cliente de la identidad de despliegue de este repositorio
    value: ${{ steps.authorize.outputs.client-id }}
  resource-group:
    description: Grupo de recursos del proyecto en el ambiente
    value: ${{ steps.authorize.outputs.resource-group }}
  location:
    description: Ubicación de Azure del ambiente
    value: ${{ steps.authorize.outputs.location }}
  registry:
    description: Servidor del registro de imágenes del ambiente ('' si el proyecto no tiene contenedores)
    value: ${{ steps.authorize.outputs.registry }}

runs:
  using: composite
  steps:
    - id: authorize
      shell: bash
      env:
        NF_API_URL: ${{ inputs.api-url }}
        NF_AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        # id-token: write es lo que hace existir estas dos variables. Sin ellas
        # el job no puede probar quién es.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::Este job no tiene 'permissions: id-token: write', así que no puede pedir su token OIDC."
          exit 1
        fi
        oidc=$(curl -sS --fail-with-body \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${NF_AUDIENCE}" | jq -r '.value')
        if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
          echo "::error::GitHub no devolvió un token OIDC para la audiencia ${NF_AUDIENCE}."
          exit 1
        fi
        body=$(mktemp)
        trap 'rm -f "$body"' EXIT
        code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
          "${NF_API_URL%/}/v1/ci/azure-session" \
          -H "Authorization: Bearer ${oidc}" \
          -H 'Accept: application/json')
        if [ "$code" != "200" ]; then
          # El endpoint explica el rechazo en 'message': rama sin ambiente,
          # ambiente que exige una promoción, repositorio no registrado, la
          # identidad de despliegue que aún no existe. Merece llegar tal cual.
          echo "::error::NanoFlow no autorizó el despliegue (HTTP ${code}): $(jq -r '.message // "sin detalle"' "$body")"
          exit 1
        fi
        field() { jq -r ".${1} // \"\"" "$body"; }
        tenant=$(field tenantId); subscription=$(field subscriptionId); client=$(field clientId)
        group=$(field resourceGroup); location=$(field location); registry=$(field registry); environment=$(field environment)
        # Son identificadores, no secretos; aun así se comprueba su forma antes
        # de pasarlos a un comando.
        guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        for v in "$tenant" "$subscription" "$client"; do
          [[ "$v" =~ $guid ]] || { echo "::error::NanoFlow respondió un identificador de Azure con una forma inesperada."; exit 1; }
        done
        [[ "$environment" =~ ^(development|staging|production)$ ]] || { echo "::error::NanoFlow respondió un ambiente inesperado."; exit 1; }
        [[ "$group" =~ ^[-A-Za-z0-9._()]{1,90}$ ]] || { echo "::error::NanoFlow respondió un grupo de recursos con una forma inesperada."; exit 1; }
        [[ "$location" =~ ^[a-z][a-z0-9]{2,29}$ ]] || { echo "::error::NanoFlow respondió una ubicación con una forma inesperada."; exit 1; }
        [ -z "$registry" ] || [[ "$registry" =~ ^[a-z0-9]{5,50}\.azurecr\.io$ ]] || { echo "::error::NanoFlow respondió un registro con una forma inesperada."; exit 1; }
        {
          echo "AZURE_TENANT_ID=${tenant}"
          echo "AZURE_SUBSCRIPTION_ID=${subscription}"
          echo "AZURE_CLIENT_ID=${client}"
          echo "AZURE_RESOURCE_GROUP=${group}"
          echo "AZURE_LOCATION=${location}"
          echo "AZURE_REGISTRY=${registry}"
        } >> "$GITHUB_ENV"
        {
          echo "environment=${environment}"
          echo "subscription-id=${subscription}"
          echo "tenant-id=${tenant}"
          echo "client-id=${client}"
          echo "resource-group=${group}"
          echo "location=${location}"
          echo "registry=${registry}"
        } >> "$GITHUB_OUTPUT"
        echo "Ambiente ${environment} · suscripción ${subscription} · grupo ${group} · identidad ${client}"

    # El inicio de sesión queda en un script porque hay que repetirlo: el token
    # de GitHub con el que la CLI de Azure pide los suyos dura pocos minutos, y
    # tras un build largo la CLI ya no puede pedir uno nuevo (para el registro,
    # para el Key Vault). El workflow lo vuelve a llamar antes del deploy.
    - name: Preparar el inicio de sesión en Azure
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/nf-az-login.sh" <<'NFLOGIN'
        #!/usr/bin/env bash
        # nf-az-login.sh — entra a Azure como la identidad de despliegue del
        # repositorio (AZURE_CLIENT_ID) canjeando el token OIDC del job. No
        # imprime ningún token.
        set -euo pipefail
        command -v az >/dev/null 2>&1 || { echo "::error::El runner no tiene la CLI de Azure (az). Los runners de GitHub la traen; un runner propio debe instalarla."; exit 1; }
        token=$(curl -sS --fail --max-time 20 --retry 2 \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value // ""') || token=""
        [ -n "$token" ] || { echo "::error::GitHub no devolvió el token OIDC con el que se entra a Azure."; exit 1; }
        echo "::add-mask::${token}"
        if ! az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none 2>"$RUNNER_TEMP/nf-az-login.err"; then
          # El motivo de Entra ID (AADSTS…) sin el token: lo más común es que la
          # identidad de despliegue no confíe en este repositorio o ambiente.
          echo "::error::Azure no aceptó la identidad de despliegue de este repositorio: $(grep -oE 'AADSTS[0-9]+[^.]*' "$RUNNER_TEMP/nf-az-login.err" | head -n 1 | cut -c1-300)"
          rm -f "$RUNNER_TEMP/nf-az-login.err"
          exit 1
        fi
        rm -f "$RUNNER_TEMP/nf-az-login.err"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID" --output none
        NFLOGIN
        chmod +x "$RUNNER_TEMP/nf-az-login.sh"

    - name: Entrar a Azure
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/nf-az-login.sh"
        # Antes de tocar nada: comprobar que la sesión aterrizó donde NanoFlow
        # dijo. Una suscripción distinta se detecta aquí, no a mitad del deploy.
        got=$(az account show --query '[id, tenantId] | join(`/`, @)' --output tsv)
        want="${AZURE_SUBSCRIPTION_ID}/${AZURE_TENANT_ID}"
        if [ "$got" != "$want" ]; then
          echo "::error::La sesión de Azure es de ${got} y NanoFlow dijo ${want}."
          exit 1
        fi
        echo "Autenticado en la suscripción ${AZURE_SUBSCRIPTION_ID}."
