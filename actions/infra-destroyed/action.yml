name: NanoFlow infra destroyed
description: >
  Dice si NanoFlow destruyó (o está destruyendo) un ambiente del repo de infra
  (doc 29 de la consola): la variable de repo NF_INFRA_DESTROYED_<AMBIENTE>
  (DEVELOPMENT, STAGING, PRODUCTION) existe desde que el usuario confirma la
  destrucción hasta que vuelve a construir la infraestructura. Mientras exista,
  apply, plan y drift no tocan ese ambiente (un push no lo recrea a medias).
  Una variable de repo y no un archivo: no viaja con las promociones.

inputs:
  environment:
    description: development | staging | production
    required: true
  vars-json:
    description: toJSON(vars) del workflow.
    required: true
  fail:
    description: "'true' falla el paso si el ambiente está destruido (el control dentro del job de apply)."
    required: false
    default: 'false'

outputs:
  destroyed:
    description: "'true' si el ambiente está destruido o destruyéndose"
    value: ${{ steps.check.outputs.destroyed }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        NF_ENV: ${{ inputs.environment }}
        VARS_JSON: ${{ inputs.vars-json }}
        NF_FAIL: ${{ inputs.fail }}
      run: |
        set -euo pipefail
        [[ "$NF_ENV" =~ ^(development|staging|production)$ ]] || { echo "::error::ambiente inválido: ${NF_ENV}"; exit 1; }
        name="NF_INFRA_DESTROYED_$(tr '[:lower:]' '[:upper:]' <<< "$NF_ENV")"
        json="${VARS_JSON:-}"
        [ -n "$json" ] || json='{}'
        value=$(jq -r --arg n "$name" '.[$n] // ""' <<< "$json")
        if [ -z "$value" ]; then
          echo "destroyed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "destroyed=true" >> "$GITHUB_OUTPUT"
        if [ "$NF_FAIL" = "true" ]; then
          echo "::error::NanoFlow destruyó (o está destruyendo) el ambiente ${NF_ENV} mientras este job esperaba: no se aplica nada. Vuelve a construir la infraestructura para recrearlo."
          exit 1
        fi
        echo "::notice::El ambiente ${NF_ENV} fue destruido desde NanoFlow; vuelve a construir la infraestructura para recrearlo."
