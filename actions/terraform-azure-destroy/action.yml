name: NanoFlow terraform Azure destroy
description: >
  La parte de Azure de terraform-azure-destroy.yml (doc 40 de la consola, §21):
  a partir de los JSON de Terraform (`terraform show -json`), inventaría lo que
  se pierde antes de confirmar y dice qué quedó después del destroy. No llama a
  Azure y nunca imprime valores del estado.

inputs:
  command:
    description: inventory | result
    required: true
  working-directory:
    description: Directorio de Terraform del ambiente.
    required: true
  state-json:
    description: "`terraform show -json` del estado (inventory: el actual; result: el de antes del destroy)."
    required: true
  plan-json:
    description: "`terraform show -json` del plan -destroy (solo inventory)."
    required: false
    default: ''
  remaining:
    description: Salida de `terraform state list` después del destroy (result).
    required: false
    default: ''
  attempts:
    description: Intentos de destroy que corrieron (result).
    required: false
    default: '0'
  out:
    description: Archivo JSON de salida.
    required: true

outputs:
  file:
    description: El archivo JSON escrito (el mismo que `out`)
    value: ${{ steps.run.outputs.file }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IN_COMMAND: ${{ inputs.command }}
        IN_STATE: ${{ inputs.state-json }}
        IN_PLAN: ${{ inputs.plan-json }}
        IN_REMAINING: ${{ inputs.remaining }}
        IN_ATTEMPTS: ${{ inputs.attempts }}
        IN_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        case "$IN_COMMAND" in inventory|result) ;; *) echo "::error::comando desconocido: ${IN_COMMAND}"; exit 1 ;; esac
        [[ "$IN_ATTEMPTS" =~ ^[0-9]+$ ]] || { echo "::error::attempts debe ser un número"; exit 1; }
        mkdir -p "$(dirname "$IN_OUT")"
        args=(node "$GITHUB_ACTION_PATH/destroy.js" "$IN_COMMAND" "$IN_STATE")
        [ "$IN_COMMAND" = inventory ] && args+=("$IN_PLAN")
        args+=(--out "$IN_OUT")
        [ -n "$IN_REMAINING" ] && args+=(--remaining "$IN_REMAINING")
        [ "$IN_COMMAND" = result ] && args+=(--attempts "$IN_ATTEMPTS")
        # Con la salida en vivo de terraform-run (log-stream si el job lo preparó).
        NF_CMD="$(printf '%q ' "${args[@]}")" NF_STEP="$IN_COMMAND" "$GITHUB_ACTION_PATH/../terraform-run/run.sh"
        echo "file=$IN_OUT" >> "$GITHUB_OUTPUT"
