# Workflow reutilizable de NanoFlow: plan de Terraform del repo de infra de un
# proyecto (<proyecto>-core-infra) en cada PR hacia la rama de un ambiente.
#
# El ambiente sale de la rama base del PR según .nanoflow/infra.json. Las
# credenciales son las del rol de PLAN de esa cuenta (solo lectura más el
# estado), asumido por OIDC nativo de GitHub: no pasa por NanoFlow y no puede
# aplicar nada. El resultado llega a NanoFlow (report-plan) y al PR como
# comentario. El check falla si fmt, validate, tflint, trivy (HIGH/CRITICAL) o
# el plan fallan.
name: NanoFlow terraform plan

on:
  workflow_call:
    inputs:
      api-url:
        description: Base del API de NanoFlow.
        required: true
        type: string
      audience:
        description: Audiencia OIDC de NanoFlow, p. ej. nanoflow-dev (para el log en vivo y el reporte).
        required: true
        type: string
      config:
        description: Configuración de ambientes que genera NanoFlow.
        required: false
        type: string
        default: .nanoflow/infra.json
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      live-logs:
        description: Reenviar a NanoFlow, en vivo, la salida de init y plan.
        required: false
        type: boolean
        default: true
      tflint-version:
        required: false
        type: string
        default: v0.64.0
      trivy-version:
        required: false
        type: string
        default: 0.75.0

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    # El que llama concede estos permisos; un workflow reutilizable no puede
    # pedir más. pull-requests: write es solo para el comentario.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: nanoflow-terraform-plan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Resolver el ambiente
        id: env
        uses: groupware-nanoflow/nanoflow-actions/actions/infra-env@v2
        with:
          branch: ${{ github.base_ref || github.ref_name }}
          config: ${{ inputs.config }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.env.outputs.found == 'true'
        with:
          terraform_version: ${{ steps.env.outputs.terraform-version }}
          terraform_wrapper: false

      - name: Credenciales de plan
        if: steps.env.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.plan-role-arn }}
          role-session-name: nanoflow-plan-${{ github.run_id }}
          aws-region: ${{ steps.env.outputs.region }}

      - name: Preparar el log en vivo
        if: steps.env.outputs.found == 'true'
        uses: groupware-nanoflow/nanoflow-actions/actions/log-stream@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          check-run-id: ${{ job.check_run_id }}
          enabled: ${{ inputs.live-logs }}

      - name: Formato
        id: fmt
        if: steps.env.outputs.found == 'true'
        run: terraform fmt -check -recursive -diff

      - name: Init y validate
        id: init
        if: steps.env.outputs.found == 'true'
        working-directory: ${{ steps.env.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          run() {
            if [ "${NF_LIVE_LOGS:-false}" = "true" ] && [ -n "${NF_LOG_STREAM:-}" ]; then
              "$@" 2>&1 | node "$NF_LOG_STREAM" --job "$GITHUB_JOB" --step init
            else
              "$@"
            fi
          }
          run terraform init -input=false -lock-timeout=5m
          run terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        if: steps.env.outputs.found == 'true'
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: tflint
        id: tflint
        if: steps.env.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      # trivy se descarga de su release y se verifica contra los checksums
      # publicados: nada de acciones de terceros con permisos sobre el job.
      - name: trivy (HIGH y CRITICAL)
        id: trivy
        if: steps.env.outputs.found == 'true'
        continue-on-error: true
        shell: bash
        env:
          TRIVY_VERSION: ${{ inputs.trivy-version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$dir/$tarball" "$base/$tarball"
          curl -sSfL -o "$dir/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tarball" -C "$dir" trivy
          "$dir/trivy" config --quiet --format json --output "$RUNNER_TEMP/trivy.json" .
          "$dir/trivy" config --quiet --severity HIGH,CRITICAL --exit-code 1 .

      - name: Plan
        id: plan
        if: steps.env.outputs.found == 'true' && steps.init.outcome == 'success'
        working-directory: ${{ steps.env.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${NF_LIVE_LOGS:-false}" = "true" ] && [ -n "${NF_LOG_STREAM:-}" ]; then
            terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan 2>&1 | node "$NF_LOG_STREAM" --job "$GITHUB_JOB" --step plan
          else
            terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
          fi
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      - name: Informar el plan
        id: report
        if: always() && steps.env.outputs.found == 'true'
        uses: groupware-nanoflow/nanoflow-actions/actions/report-plan@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          environment: ${{ steps.env.outputs.environment }}
          status: ${{ steps.plan.outcome == 'success' && 'succeeded' || 'failed' }}
          plan-json: ${{ steps.plan.outcome == 'success' && format('{0}/plan.json', runner.temp) || '' }}
          trivy-json: ${{ runner.temp }}/trivy.json
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      # Un solo comentario por ambiente y PR: se actualiza en cada push.
      - name: Comentar en el PR
        if: always() && steps.report.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NF_COMMENT: ${{ steps.report.outputs.comment-file }}
          NF_ENV: ${{ steps.env.outputs.environment }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- nanoflow:terraform-plan:${NF_ENV} -->"
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${NF_COMMENT}" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F "body=@${NF_COMMENT}" >/dev/null
          fi

      - name: Resumen
        if: always() && steps.report.outcome == 'success'
        shell: bash
        run: cat "${{ steps.report.outputs.comment-file }}" >> "$GITHUB_STEP_SUMMARY"

      # trivy no corta el job para que el plan y el reporte existan igual; aquí
      # se decide el check.
      - name: Resultado
        if: steps.env.outputs.found == 'true'
        shell: bash
        env:
          TRIVY: ${{ steps.trivy.outcome }}
        run: |
          if [ "$TRIVY" != "success" ]; then
            echo "::error::trivy encontró hallazgos HIGH o CRITICAL (o no pudo correr). Corrígelos o justifícalos con '# trivy:ignore:<id>' junto al recurso."
            exit 1
          fi
