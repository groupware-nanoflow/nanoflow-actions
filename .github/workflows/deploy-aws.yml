# Workflow reutilizable de NanoFlow: despliega el repositorio en la cuenta AWS
# del ambiente al que corresponde la rama.
#
# El repositorio del cliente no copia estos pasos, los invoca. Así el pipeline
# se corrige y se mejora para todos los proyectos con una release de este repo,
# en vez de con un PR en cada uno.
name: NanoFlow deploy to AWS

on:
  workflow_call:
    inputs:
      api-url:
        description: Base del API de NanoFlow.
        required: true
        type: string
      audience:
        description: Audiencia OIDC, p. ej. nanoflow-dev.
        required: true
        type: string
      manifest:
        description: Manifiesto de despliegue del repositorio.
        required: false
        type: string
        default: .nanoflow/deploy.yml
      working-directory:
        description: Directorio desde el que se ejecutan build y deploy.
        required: false
        type: string
        default: .
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      live-logs:
        description: Reenviar a NanoFlow, en vivo, la salida de build y deploy.
        required: false
        type: boolean
        default: true
      environment:
        description: >
          GitHub Environment del ambiente de esta rama (development, staging,
          production). Con él, el job ve las variables NF_* que NanoFlow escribe
          ahí (el contrato de plataforma: URL del API, issuer OIDC…) y las
          exporta a build y deploy. NanoFlow comprueba que sea el de la rama.
          Vacío: sin GitHub Environment, como antes.
        required: false
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    permissions:
      # Lo mínimo: leer el código y poder pedir el token OIDC. En particular NO
      # se pide `contents: write`: un despliegue no reescribe el repositorio.
      # El mismo token OIDC autentica las credenciales, el log en vivo y el
      # reporte del despliegue. El job que llama tiene que conceder id-token:
      # write: un workflow reutilizable no puede pedir más de lo que recibe.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Leer el manifiesto
        id: manifest
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No existe $MANIFEST. NanoFlow lo crea al registrar el repositorio; si lo borraste, vuelve a generarlo desde la consola."
            exit 1
          fi
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          {
            echo "node=$(yq -r '.toolchain.node // ""' "$MANIFEST")"
            echo "go=$(yq -r '.toolchain.go // ""' "$MANIFEST")"
            echo "python=$(yq -r '.toolchain.python // ""' "$MANIFEST")"
          } >> "$GITHUB_OUTPUT"

      - name: Credenciales del ambiente
        id: aws
        uses: groupware-nanoflow/nanoflow-actions/actions/aws-credentials@v1
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}

      - name: Resolver los comandos del ambiente
        id: commands
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          ENVIRONMENT: ${{ steps.aws.outputs.environment }}
        run: |
          set -euo pipefail
          # Un ambiente puede sobrescribir build y deploy; si no lo hace, hereda
          # los de la raíz. Se resuelve DESPUÉS de saber el ambiente, porque el
          # ambiente lo decide NanoFlow y no el manifiesto.
          build=$(yq -r ".environments.${ENVIRONMENT}.build // .build // \"\"" "$MANIFEST")
          deploy=$(yq -r ".environments.${ENVIRONMENT}.deploy // .deploy // \"\"" "$MANIFEST")
          if [ -z "$deploy" ]; then
            echo "::error::El manifiesto no define 'deploy' ni para el ambiente ${ENVIRONMENT} ni en la raíz."
            exit 1
          fi
          # La URL de lo desplegado, si el manifiesto la declara: la del ambiente
          # o la de la raíz. Solo se informa si el despliegue sale bien.
          url=$(yq -r ".environments.${ENVIRONMENT}.url // .url // \"\"" "$MANIFEST" | head -n 1)
          # mask-env: variables del entorno de los pasos cuyos valores el log en
          # vivo tapa antes de enviarlos. Lista o texto separado por comas, en la
          # raíz y por ambiente; se juntan las dos. Solo nombres de variable.
          mask_env=$(
            for key in '.["mask-env"]' ".environments.${ENVIRONMENT}[\"mask-env\"]"; do
              case "$(yq -r "${key} | tag" "$MANIFEST")" in
                '!!seq') yq -r "${key}[]" "$MANIFEST" ;;
                '!!str') yq -r "${key}" "$MANIFEST" | tr ', ' '\n\n' ;;
              esac
            done | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' | sort -u | paste -sd, - || true
          )
          {
            echo "build<<__NF__"; echo "$build"; echo "__NF__"
            echo "deploy<<__NF__"; echo "$deploy"; echo "__NF__"
            echo "url=${url}"
            echo "mask-env=${mask_env}"
          } >> "$GITHUB_OUTPUT"

      # El contrato de plataforma del ambiente (doc 11 §11 de la consola): las
      # variables NF_* del GitHub Environment pasan al entorno de build y deploy,
      # y el manifiesto puede darles otro nombre con env-map (p. ej.
      # VITE_API_URL: NF_API_URL) en la raíz o por ambiente. Solo se imprimen
      # nombres. Sin `environment` no hay variables NF_* y el paso no hace nada.
      - name: Contrato de plataforma
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          ENVIRONMENT: ${{ steps.aws.outputs.environment }}
          DECLARED: ${{ inputs.environment }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          if [ -n "$DECLARED" ] && [ "$DECLARED" != "$ENVIRONMENT" ]; then
            echo "::error::El workflow declara el GitHub Environment ${DECLARED}, pero NanoFlow resolvió ${ENVIRONMENT} para esta rama."
            exit 1
          fi
          # name=value en una línea cada uno; un valor con salto de línea se
          # escribe con delimitador.
          export_var() {
            local name="$1" value="$2" delim
            if [[ "$value" == *$'\n'* ]]; then
              delim="__NF_$(openssl rand -hex 8)__"
              { echo "${name}<<${delim}"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
            else
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          }
          # Solo las NF_* con valor string: el contrato.
          contract=$(jq -c 'with_entries(select((.key | test("^NF_[A-Z0-9_]+$")) and (.value | type == "string")))' <<< "$VARS_JSON")
          if [ "$(jq 'length' <<< "$contract")" -eq 0 ]; then
            echo "Sin variables NF_* en este job (sin GitHub Environment o NanoFlow aún no las escribió)."
            exit 0
          fi
          while IFS= read -r name; do
            export_var "$name" "$(jq -r --arg n "$name" '.[$n]' <<< "$contract")"
          done < <(jq -r 'keys[]' <<< "$contract")
          echo "Contrato de plataforma: $(jq -r 'keys | join(" ")' <<< "$contract")"
          # env-map: DESTINO: NF_ORIGEN. Lo del ambiente gana sobre la raíz.
          mapped=$(yq -o=json '(.["env-map"] // {}) * (.environments.'"${ENVIRONMENT}"'["env-map"] // {})' "$MANIFEST")
          while IFS=$'\t' read -r target source; do
            [ -n "$target" ] || continue
            if ! [[ "$target" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || [[ "$target" =~ ^(AWS_|GITHUB_|ACTIONS_|RUNNER_|NF_) ]]; then
              echo "::warning::env-map: '${target}' no es un nombre válido o es reservado; se ignora."
              continue
            fi
            if [ "$(jq --arg n "$source" 'has($n)' <<< "$contract")" != true ]; then
              # Normal: el env-map generado lista también las claves OIDC, que
              # solo existen con un proveedor de identidad.
              echo "  ${target}: ${source} no está en el contrato de este ambiente; se omite."
              continue
            fi
            export_var "$target" "$(jq -r --arg n "$source" '.[$n]' <<< "$contract")"
            echo "  ${target} ← ${source}"
          done < <(jq -r 'to_entries[] | [.key, (.value | tostring)] | @tsv' <<< "$mapped")

      # El log en vivo: GitHub no expone el de un job mientras corre, así que
      # build y deploy pasan su salida por log-stream, que la sigue imprimiendo
      # aquí y la reenvía a NanoFlow. Con live-logs: false queda en solo-eco.
      - name: Preparar el log en vivo
        uses: groupware-nanoflow/nanoflow-actions/actions/log-stream@v1
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          check-run-id: ${{ job.check_run_id }}
          mask-env: ${{ steps.commands.outputs.mask-env }}
          enabled: ${{ inputs.live-logs }}

      - name: Informar el inicio del despliegue
        uses: groupware-nanoflow/nanoflow-actions/actions/report-deployment@v1
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          status: in_progress

      - uses: actions/setup-node@v4
        if: steps.manifest.outputs.node != ''
        with:
          node-version: ${{ steps.manifest.outputs.node }}

      - uses: actions/setup-go@v5
        if: steps.manifest.outputs.go != ''
        with:
          go-version: ${{ steps.manifest.outputs.go }}

      - uses: actions/setup-python@v5
        if: steps.manifest.outputs.python != ''
        with:
          python-version: ${{ steps.manifest.outputs.python }}

      # Los comandos del manifiesto se pasan por variable de entorno y se
      # ejecutan desde un archivo, no interpolados dentro del `run`. Interpolar
      # rompe con cualquier comilla y convierte el manifiesto en parte del
      # script del workflow; así es solo lo que dice ser: un script.
      #
      # nf-run.sh corre el script con su salida en vivo (log-stream si el log en
      # vivo está preparado; si no, solo eco) SIN atar el fin del paso a una
      # tubería: el script escribe a un archivo que se sigue mientras corre. Con
      # `script | node log-stream`, un hijo rezagado del build (vite, npm…) con
      # la salida heredada dejaba la tubería abierta y el paso colgado aunque el
      # build ya hubiera terminado. Sale con el código del script, que se guarda
      # para el reporte. Es el mismo enfoque que actions/terraform-run.
      - name: Preparar el runner de comandos
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/nf-run.sh" <<'NFRUN'
          #!/usr/bin/env bash
          # nf-run.sh — NF_SCRIPT=<archivo> NF_STEP=<paso> nf-run.sh
          set -uo pipefail
          : "${NF_SCRIPT:?NF_SCRIPT vacío}"
          step="${NF_STEP:-run}"
          log="$(mktemp "${RUNNER_TEMP:-/tmp}/nf-$step.XXXXXX")"
          # Sin stdin: nada puede quedarse esperando una respuesta, y un hijo
          # rezagado solo retiene el archivo.
          bash -euo pipefail "$NF_SCRIPT" >"$log" 2>&1 </dev/null &
          cmd=$!
          # Fin explícito por archivo, no por `kill -0`: un proceso que ya salió pero que
          # el shell aún no recogió (zombie) sigue respondiendo a `kill -0`, y el
          # seguimiento nunca terminaba (paso colgado con el build ya hecho).
          done_flag="$log.done"
          reader_flag="$log.reader"
          trap 'rm -f "$log" "$done_flag" "$reader_flag"' EXIT

          # follow imprime lo nuevo del archivo cada medio segundo y termina tras una
          # última lectura cuando aparece done_flag: es el único escritor de la tubería
          # hacia el lector, así que el lector recibe su fin de entrada a tiempo. Si la
          # salida se detiene 5 min con el comando vivo, deja una vez el árbol de
          # procesos en el log del paso para ver qué sigue corriendo.
          follow() {
            local offset=0 size fin quiet=0 dumped=0
            while :; do
              fin=0
              [ -e "$done_flag" ] && fin=1
              size=$(wc -c <"$log" | tr -d ' ')
              if [ "$size" -gt "$offset" ]; then
                tail -c "+$((offset + 1))" "$log" | head -c "$((size - offset))"
                offset=$size
                quiet=0
              else
                quiet=$((quiet + 1))
              fi
              [ "$fin" = 1 ] && break
              if [ "$quiet" -ge 600 ] && [ "$dumped" = 0 ]; then
                dumped=1
                { echo "::group::nf-run: 5 min sin salida; procesos en curso"; ps -eo pid,ppid,etime,args 2>/dev/null; echo "::endgroup::"; } >&2
              fi
              sleep 0.5
            done
          }

          # El lector, en segundo plano: log-stream si el log en vivo está preparado; si
          # no, solo eco. reader_flag marca que terminó (también sin `kill -0`).
          if [ "${NF_LIVE_LOGS:-false}" = "true" ] && [ -n "${NF_LOG_STREAM:-}" ] && command -v node >/dev/null 2>&1; then
            { follow | node "$NF_LOG_STREAM" --job "${GITHUB_JOB:-job}" --step "$step"; : >"$reader_flag"; } &
          else
            { follow; : >"$reader_flag"; } &
          fi
          reader=$!

          wait "$cmd"
          rc=$?
          : >"$done_flag"
          # El lector cierra solo (log-stream se da hasta 10 s para vaciar lo pendiente);
          # a los 20 s se corta, para que nada retenga el paso.
          for _ in $(seq 1 40); do
            [ -e "$reader_flag" ] && break
            sleep 0.5
          done
          if [ ! -e "$reader_flag" ]; then
            pkill -TERM -P "$reader" 2>/dev/null
            kill -TERM "$reader" 2>/dev/null
          fi
          wait "$reader" 2>/dev/null
          exit "$rc"
          NFRUN
          chmod +x "$RUNNER_TEMP/nf-run.sh"

      - name: Build
        id: build
        if: steps.commands.outputs.build != ''
        # Un build colgado falla en minutos (y se informa), no a las 6 horas.
        timeout-minutes: 30
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          NF_BUILD: ${{ steps.commands.outputs.build }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/nf-build.sh"
          printf '%s\n' "$NF_BUILD" > "$script"
          set +e
          NF_SCRIPT="$script" NF_STEP=build "$RUNNER_TEMP/nf-run.sh"
          rc=$?
          echo "exit-code=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Migraciones antes del código (doc 11 §14 de la consola): si el
      # manifiesto declara `databases`, cada base se migra con su Lambda
      # migradora (bootstrap, snapshot si hay contract/destructive fuera de
      # development, apply) y se informa a NanoFlow. Si falla, no hay deploy:
      # todo lo que llega es expand/migrate, así que el código anterior sigue
      # funcionando con el esquema que quedó. Sin `databases` no hace nada.
      - name: Migraciones
        id: migrate
        # Incluye la espera del snapshot previo a un lote contract/destructive.
        timeout-minutes: 75
        uses: groupware-nanoflow/nanoflow-actions/actions/db-migrate@v1
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          manifest: ${{ inputs.manifest }}
          environment: ${{ steps.aws.outputs.environment }}

      - name: Deploy
        id: deploy
        timeout-minutes: 30
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          NF_DEPLOY: ${{ steps.commands.outputs.deploy }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/nf-deploy.sh"
          printf '%s\n' "$NF_DEPLOY" > "$script"
          set +e
          NF_SCRIPT="$script" NF_STEP=deploy "$RUNNER_TEMP/nf-run.sh"
          rc=$?
          echo "exit-code=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # El resultado, pase lo que pase: si el job falla o se cancela también se
      # informa. Solo si hubo credenciales, porque sin ellas no hubo despliegue
      # (y NanoFlow respondería que la rama no despliega en ningún ambiente).
      - name: Resolver el resultado del despliegue
        id: result
        if: always() && steps.aws.outcome == 'success'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_EXIT: ${{ steps.build.outputs.exit-code }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          MIGRATE_ERROR: ${{ steps.migrate.outputs.error }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_EXIT: ${{ steps.deploy.outputs.exit-code }}
          URL: ${{ steps.commands.outputs.url }}
        run: |
          case "$JOB_STATUS" in
            success) status=success ;;
            cancelled) status=cancelled ;;
            *) status=failure ;;
          esac
          error=''
          if [ "$status" = "failure" ]; then
            if [ "$BUILD_OUTCOME" = "failure" ]; then
              error="build: exit ${BUILD_EXIT:-?}"
            elif [ "$MIGRATE_OUTCOME" = "failure" ]; then
              error="migrate: ${MIGRATE_ERROR:-falló}"
            elif [ "$DEPLOY_OUTCOME" = "failure" ]; then
              error="deploy: exit ${DEPLOY_EXIT:-?}"
            else
              error="el job falló antes del despliegue"
            fi
          fi
          url=''
          [ "$status" = "success" ] && url="$URL"
          {
            echo "status=${status}"
            echo "error=${error}"
            echo "url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: Informar el resultado del despliegue
        if: always() && steps.result.outcome == 'success'
        uses: groupware-nanoflow/nanoflow-actions/actions/report-deployment@v1
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          status: ${{ steps.result.outputs.status }}
          environment-url: ${{ steps.result.outputs.url }}
          error: ${{ steps.result.outputs.error }}

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "## Despliegue NanoFlow"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ambiente | ${{ steps.aws.outputs.environment }} |"
            echo "| Cuenta AWS | ${{ steps.aws.outputs.account-id }} |"
            echo "| Región | ${{ steps.aws.outputs.region }} |"
            echo "| Rama | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
