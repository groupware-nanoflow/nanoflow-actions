# mobile-ui-tests.yml — pruebas de UI de una app nativa con Maestro (doc 42 §16.1
# de la consola de NanoFlow).
#
# Lo llama .github/workflows/nanoflow-ui-tests.yml, que NanoFlow agrega al
# conectar un repositorio android o ios. Compila el debug de development, lo
# instala en un emulador (Android, ubuntu-latest con KVM) o en un simulador
# (iOS, macos-latest) y corre los flujos de .maestro/ contra development real:
# el API desplegado y el usuario de prueba de development.
#
# La configuración y el usuario de prueba los entrega NanoFlow
# (POST /v1/ci/mobile-test-session) solo a ESTE workflow: el endpoint exige que
# job_workflow_ref del token OIDC sea este archivo. La contraseña se enmascara
# y solo llega a Maestro; nunca va al artifact.
#
# El proyecto puede apagar las pruebas de UI de cada plataforma desde NanoFlow
# (Harness del proyecto, doc 54 de la consola): el job gate se lo pregunta
# antes de arrancar el emulador o macOS. Apagadas, ui-tests queda «skipped» y
# la corrida termina en verde. Si la pregunta falla, las pruebas corren.
#
# Los flujos van en una carpeta por feature, .maestro/<slug>/<idDelCriterio>.yaml
# (doc 53 §16 de la consola): el slug es el del feature (título + los 6 últimos
# hex de su id). Los de la raíz de .maestro/ son de antes y siguen corriendo.
# Corren todos, una carpeta a la vez; si NanoFlow dice de qué feature es la
# rama y su carpeta tiene flujos, solo ella decide el check: las demás son
# regresión, se ven en result.json y en avisos, pero no lo ponen en rojo.
#
# El artifact nanoflow-ui-tests-<plataforma> es la evidencia del evaluador:
# result.json (status passed | failed | no-flows | setup-failed, un mensaje,
# feature, decidedBy y suites), report.xml (JUnit: un caso por flujo; los de
# una carpeta se llaman <slug>/<idDelCriterio>), reports/<carpeta>.xml, las
# capturas (screenshots/ para la raíz, screenshots/<slug>/ para cada feature)
# y la salida de depuración de Maestro (debug/<carpeta>/), con la contraseña
# reemplazada por ***.
name: mobile-ui-tests

on:
  workflow_call:
    inputs:
      api-url:
        description: Base del API de NanoFlow.
        type: string
        required: true
      audience:
        description: Audiencia OIDC, p. ej. nanoflow-dev.
        type: string
        required: true
      platform:
        description: android | ios.
        type: string
        required: true
      xcode-project:
        description: iOS — el proyecto de Xcode de la raíz, sin .xcodeproj (su esquema compartido tiene el mismo nombre).
        type: string
        default: ""
      xcode-workspace:
        description: iOS — compilar <xcode-project>.xcworkspace en lugar del proyecto.
        type: boolean
        default: false
      android-api-level:
        description: Android — nivel de API del emulador.
        type: number
        default: 34
      android-profile:
        # Sin perfil, el emulador era de 320×640: el formulario de Keycloak
        # apenas cabía y el teclado tapaba «Sign In» (doc 53 §15 de la consola).
        description: Android — perfil de hardware del emulador (avdmanager list device).
        type: string
        default: pixel_6
      android-hw-keyboard:
        # Con teclado físico, Android no abre el teclado en pantalla y no tapa
        # botones. Ojo: hideKeyboard de Maestro en Android es la tecla Atrás.
        description: Android — emulador con teclado físico (sin teclado en pantalla).
        type: boolean
        default: true
      maestro-version:
        # 2.x: setOrientation y los comandos que la documentación de Maestro da
        # hoy. Con la 1.40.0 un comando que no conoce tumba todos los flujos
        # antes de correr el primero (doc 53 §12 de la consola).
        description: Versión de la CLI de Maestro.
        type: string
        default: "2.12.1"
      flows:
        description: Carpeta de los flujos.
        type: string
        default: .maestro

jobs:
  # ¿El proyecto tiene encendidas las pruebas de UI de esta plataforma? Unos
  # segundos en ubuntu: con iOS apagado, macOS (diez veces los minutos de
  # Linux) no llega a arrancar. Nunca falla: si NanoFlow no responde, enabled
  # queda vacío y las pruebas corren como siempre.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: ¿Pruebas de UI encendidas en NanoFlow?
        id: probe
        shell: bash
        env:
          NF_API: ${{ inputs.api-url }}
          NF_AUDIENCE: ${{ inputs.audience }}
          NF_PLATFORM: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          run_anyway() { echo "::warning::$1 Las pruebas de UI corren."; exit 0; }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            run_anyway "Este job no tiene 'permissions: id-token: write': no puede preguntar a NanoFlow."
          fi
          oidc=$(curl -sS --fail-with-body --max-time 30 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${NF_AUDIENCE}" | jq -r '.value // empty')
          [ -n "$oidc" ] || run_anyway "GitHub no devolvió un token OIDC para la audiencia ${NF_AUDIENCE}."
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST "${NF_API%/}/v1/ci/mobile-test-session" \
            -H "Authorization: Bearer ${oidc}" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"probe":true}') || code=000
          [ "$code" = "200" ] || run_anyway "NanoFlow no respondió la consulta (HTTP ${code}): $(jq -r '.message // "sin detalle"' "$body" 2>/dev/null || echo 'sin detalle')."
          enabled=$(jq -r 'if .enabled == false then "false" else "true" end' "$body" 2>/dev/null || echo true)
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            msg="Pruebas de UI de ${NF_PLATFORM} apagadas en NanoFlow (Harness del proyecto): no se corren los flujos de Maestro."
            echo "::notice::${msg}"
            { echo "### Pruebas de UI (${NF_PLATFORM})"; echo; echo "**apagadas** — ${msg}"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pruebas de UI de ${NF_PLATFORM} encendidas."
          fi

  ui-tests:
    needs: gate
    # Solo un «false» explícito las apaga: si el gate falló, corren.
    if: ${{ !cancelled() && needs.gate.outputs.enabled != 'false' }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      NF_FLOWS: ${{ inputs.flows }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la salida
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.platform }}' in
            android|ios) ;;
            *) echo "::error::platform debe ser android o ios."; exit 1 ;;
          esac
          # Fuera del checkout: nada de la salida se confunde con el repositorio.
          NF_OUT="$RUNNER_TEMP/nanoflow-ui-tests"
          echo "NF_OUT=$NF_OUT" >> "$GITHUB_ENV"
          mkdir -p "$NF_OUT/screenshots"
          # result.json lo reescribe cada paso que decide algo; si el job se
          # corta antes, el evaluador ve setup-failed con este mensaje.
          jq -n '{status: "setup-failed", message: "El job terminó antes de correr los flujos: mira el log de la corrida."}' > "$NF_OUT/result.json"

      - name: ¿Hay flujos?
        id: flows
        shell: bash
        run: |
          set -euo pipefail
          # Sin la carpeta, find sale con error y pipefail tumbaría el paso:
          # un repo sin flujos (el primer PR, el de la conexión) es no-flows.
          # Cuentan los de la raíz y los de cada carpeta de feature (su nombre
          # termina en -<6 hex>); config.yaml es la configuración de Maestro y
          # otra carpeta (subflujos) no se corre sola.
          count=0
          if [ -d "$NF_FLOWS" ]; then
            count=$(find "$NF_FLOWS" -mindepth 1 -maxdepth 2 -type f \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'config.yaml' ! -name 'config.yml' | awk -F/ -v base="$NF_FLOWS" '
                { rel = substr($0, length(base) + 2); n = split(rel, p, "/") }
                n == 1 || (n == 2 && p[1] ~ /-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]$/) { c++ }
                END { print c + 0 }')
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            jq -n --arg dir "$NF_FLOWS" '{status: "no-flows", message: ("El repositorio no tiene flujos de Maestro en " + $dir + "/ (uno por criterio: " + $dir + "/<slug del feature>/<idDelCriterio>.yaml).")}' > "$NF_OUT/result.json"
            echo "::notice::No hay flujos de Maestro en ${NF_FLOWS}/: no hay nada que probar."
          else
            echo "${count} flujos en ${NF_FLOWS}/."
          fi

      - name: Sesión de prueba de development
        if: steps.flows.outputs.count != '0'
        shell: bash
        env:
          NF_API: ${{ inputs.api-url }}
          NF_AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          setup_failed() {
            jq -n --arg m "$1" '{status: "setup-failed", message: $m}' > "$NF_OUT/result.json"
            echo "::error::$1"
            exit 1
          }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            setup_failed "Este job no tiene 'permissions: id-token: write', así que no puede pedir su token OIDC."
          fi
          oidc=$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${NF_AUDIENCE}" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            setup_failed "GitHub no devolvió un token OIDC para la audiencia ${NF_AUDIENCE}."
          fi
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${NF_API%/}/v1/ci/mobile-test-session" \
            -H "Authorization: Bearer ${oidc}" -H 'Accept: application/json')
          if [ "$code" != "200" ]; then
            setup_failed "NanoFlow no entregó la sesión de prueba (HTTP ${code}): $(jq -r '.message // "sin detalle"' "$body" 2>/dev/null || echo 'sin detalle')"
          fi
          # La contraseña llega por HTTP: GitHub no la conoce. Se enmascara antes
          # de que cualquier otro comando la pueda imprimir.
          echo "::add-mask::$(jq -r '.testUser.password' "$body")"
          {
            echo "NF_APP_ID=$(jq -r '.appId' "$body")"
            echo "NF_TEST_USERNAME=$(jq -r '.testUser.username' "$body")"
            echo "NF_TEST_PASSWORD=$(jq -r '.testUser.password' "$body")"
            # El feature de la rama (doc 53 §16): su carpeta decide el check.
            echo "NF_FEATURE_SLUG=$(jq -r '.feature.slug // empty | select(test("^[a-z0-9-]+$"))' "$body")"
            # Las NF_* de development de la app: las lee el build (Gradle o el .xcconfig).
            jq -r '.variables | to_entries[] | select(.key | test("^NF_[A-Z0-9_]+$")) | "\(.key)=\(.value)"' "$body"
          } >> "$GITHUB_ENV"
          echo "Development · app $(jq -r '.appId' "$body") · usuario de prueba $(jq -r '.testUser.username' "$body") · feature $(jq -r '.feature.slug // "(la rama no es de un feature: deciden todos los flujos)"' "$body")"

      - name: Java
        if: steps.flows.outputs.count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Maestro
        if: steps.flows.outputs.count != '0'
        shell: bash
        env:
          MAESTRO_VERSION: ${{ inputs.maestro-version }}
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------- Android
      - name: Compilar el debug de development (Android)
        if: steps.flows.outputs.count != '0' && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if ! ./gradlew --no-daemon assembleDevelopmentDebug; then
            jq -n '{status: "setup-failed", message: "No compiló el debug del flavor development (./gradlew assembleDevelopmentDebug): mira el log."}' > "$NF_OUT/result.json"
            exit 1
          fi
          apk=$(ls app/build/outputs/apk/development/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            jq -n '{status: "setup-failed", message: "El build no dejó el APK en app/build/outputs/apk/development/debug/."}' > "$NF_OUT/result.json"
            exit 1
          fi
          echo "NF_APK=$(pwd)/$apk" >> "$GITHUB_ENV"

      - name: KVM para el emulador
        if: steps.flows.outputs.count != '0' && inputs.platform == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Guion de las pruebas
        if: steps.flows.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          # Un solo guion para las dos plataformas: el emulador de Android corre
          # cada línea de su script por separado, así que se le pasa este archivo.
          cat > "$RUNNER_TEMP/nf-maestro.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          flows="$(pwd)/${NF_FLOWS}"
          slug="${NF_FEATURE_SLUG:-}"
          runs="$NF_OUT/runs.txt"
          mkdir -p "$NF_OUT/reports"
          : > "$runs"
          has_flows() { [ -n "$(find "$1" -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name 'config.yaml' ! -name 'config.yml' -print -quit)" ]; }
          # Las carpetas: primero la del feature de la rama (su resultado llega
          # antes), después las de otros features y al final la raíz.
          suites=()
          if [ -n "$slug" ] && [ -d "$flows/$slug" ] && has_flows "$flows/$slug"; then suites+=("$slug"); fi
          for d in "$flows"/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            [ "$name" = "$slug" ] && continue
            [[ "$name" =~ -[0-9a-f]{6}$ ]] || continue
            has_flows "$d" && suites+=("$name")
          done
          if has_flows "$flows"; then suites+=("raiz"); fi
          for label in "${suites[@]}"; do
            if [ "$label" = "raiz" ]; then dir="$flows"; shots="$NF_OUT/screenshots"; else dir="$flows/$label"; shots="$NF_OUT/screenshots/$label"; fi
            mkdir -p "$shots"
            echo "::group::Flujos de ${NF_FLOWS}/$([ "$label" = "raiz" ] || echo "$label/")"
            ( cd "$shots" && maestro test "$dir" --format junit --output "$NF_OUT/reports/$label.xml" --debug-output "$NF_OUT/debug/$label" \
                -e NF_APP_ID="$NF_APP_ID" -e NF_TEST_USERNAME="$NF_TEST_USERNAME" -e NF_TEST_PASSWORD="$NF_TEST_PASSWORD" )
            rc=$?
            echo "::endgroup::"
            # Desde Maestro 2.x, takeScreenshot escribe dentro de la salida de
            # depuración de cada flujo (<flujo>/takeScreenshot/), no en la carpeta
            # actual: se copian a la carpeta de capturas, donde las busca el evaluador.
            find "$NF_OUT/debug/$label" -type f -path '*/takeScreenshot/*.png' -exec cp -n {} "$shots/" \; 2>/dev/null || true
            echo "$label $rc" >> "$runs"
          done
          # Un solo report.xml, result.json y la decisión del check.
          python3 -I "$RUNNER_TEMP/nf-maestro-result.py" "$NF_OUT" "$slug" "$runs"
          code=$?
          case "$code" in
            0|3) ;;
            *)
              # El resumen falló: decide cualquier carpeta en rojo, como antes.
              code=0
              while read -r label rc; do [ "$rc" = "0" ] || code=3; done < "$runs"
              if [ "$code" = "0" ]; then st=passed; msg="Todos los flujos pasaron (no se pudo armar el resumen por carpeta)."; else st=failed; msg="Algún flujo falló (no se pudo armar el resumen por carpeta): mira reports/."; fi
              jq -n --arg s "$st" --arg m "$msg" '{status: $s, message: $m}' > "$NF_OUT/result.json"
              ;;
          esac
          rm -f "$runs"
          [ "$code" = "0" ]
          SH
          # El resumen: junta los reportes en report.xml (los casos de una
          # carpeta se llaman <slug>/<flujo>) y escribe result.json. Sale con 0
          # si las carpetas que deciden pasaron y con 3 si no.
          cat > "$RUNNER_TEMP/nf-maestro-result.py" <<'PY'
          import json, os, sys
          import xml.etree.ElementTree as ET

          out, slug, runs_file = sys.argv[1], sys.argv[2], sys.argv[3]
          runs = [line.split() for line in open(runs_file, encoding="utf-8") if line.strip()]
          merged = ET.Element("testsuites")
          suites = []
          for label, rc in runs:
              rc = int(rc)
              root = label == "raiz"
              flows, failed = 0, []
              path = os.path.join(out, "reports", label + ".xml")
              try:
                  tree = ET.parse(path)
              except (OSError, ET.ParseError):
                  tree = None
              if tree is not None:
                  for ts in tree.getroot().iter("testsuite"):
                      ts.set("name", "raiz" if root else label)
                      for tc in ts.findall("testcase"):
                          name = tc.get("name") or tc.get("id") or "?"
                          if not root:
                              for attr in ("id", "name", "classname"):
                                  if tc.get(attr) is not None:
                                      tc.set(attr, label + "/" + tc.get(attr))
                          flows += 1
                          if tc.find("failure") is not None or tc.find("error") is not None:
                              failed.append(name)
                      merged.append(ts)
              suites.append({
                  "dir": "." if root else label,
                  "status": "passed" if rc == 0 else "failed",
                  "flows": flows,
                  "failed": len(failed),
                  "failedFlows": failed[:50],
                  "exitCode": rc,
              })
          ET.ElementTree(merged).write(os.path.join(out, "report.xml"), encoding="UTF-8", xml_declaration=True)

          own = [s for s in suites if slug and s["dir"] == slug]
          deciding = own or suites
          for s in suites:
              s["decides"] = s in deciding
          ok = all(s["status"] == "passed" for s in deciding)

          def upper_first(t):
              return t[:1].upper() + t[1:]

          def where(s):
              return "la raíz de .maestro/" if s["dir"] == "." else ".maestro/" + s["dir"] + "/"

          def detail(s):
              if s["status"] == "passed":
                  return "los %d flujos de %s pasaron" % (s["flows"], where(s))
              if s["flows"] == 0:
                  return "%s: Maestro terminó con código %d antes de correr un flujo (mira el log)" % (where(s), s["exitCode"])
              return "%d de %d flujos de %s fallaron (%s)" % (s["failed"], s["flows"], where(s), ", ".join(s["failedFlows"][:10]))

          if own:
              msg = upper_first(detail(own[0])) + "."
              others = [s for s in suites if not s["decides"]]
              bad = [s for s in others if s["status"] != "passed"]
              if bad:
                  msg += " Regresión de otras carpetas (no decide el check): " + "; ".join(detail(s) for s in bad) + "."
              elif others:
                  msg += " Regresión: los flujos de las otras %d carpetas pasaron." % len(others)
          else:
              total = sum(s["flows"] for s in suites)
              bad = [s for s in suites if s["status"] != "passed"]
              msg = ("Todos los flujos pasaron (%d)." % total) if not bad else (upper_first("; ".join(detail(s) for s in bad)) + ": report.xml dice cuáles.")
              if slug:
                  msg += " La carpeta del feature, .maestro/" + slug + "/, no tiene flujos: deciden todos."

          result = {
              "status": "passed" if ok else "failed",
              "message": msg,
              "feature": slug or None,
              "decidedBy": "feature" if own else "all",
              "suites": suites,
          }
          with open(os.path.join(out, "result.json"), "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          for s in suites:
              if not s["decides"] and s["status"] != "passed":
                  print("::warning::Regresión: " + detail(s))
          sys.exit(0 if ok else 3)
          PY
          chmod +x "$RUNNER_TEMP/nf-maestro.sh"

      - name: Pruebas en el emulador (Android)
        if: steps.flows.outputs.count != '0' && inputs.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.android-api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.android-profile }}
          disable-animations: true
          # Con teclado físico, Android no abre el teclado en pantalla: no tapa
          # el botón que el flujo toca después de escribir (el «Sign In» de
          # Keycloak, doc 53 §15). inputText de Maestro escribe igual; en
          # cambio hideKeyboard, que en Android es la tecla Atrás, sale de la
          # pantalla: el skill mobile del harness dice que no se use.
          enable-hw-keyboard: ${{ inputs.android-hw-keyboard }}
          script: adb install -r "$NF_APK" && adb shell settings put secure show_ime_with_hard_keyboard 0 && "$RUNNER_TEMP/nf-maestro.sh"

      # -------------------------------------------------------------------- iOS
      - name: Compilar el debug de development (iOS)
        if: steps.flows.outputs.count != '0' && inputs.platform == 'ios'
        shell: bash
        env:
          NF_XCODE_PROJECT: ${{ inputs.xcode-project }}
          NF_XCODE_WORKSPACE: ${{ inputs.xcode-workspace }}
        run: |
          set -euo pipefail
          fail() { jq -n --arg m "$1" '{status: "setup-failed", message: $m}' > "$NF_OUT/result.json"; echo "::error::$1"; exit 1; }
          [ -n "$NF_XCODE_PROJECT" ] || fail "Falta xcode-project: vuelve a conectar el repositorio desde NanoFlow."
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i -E 'beta|release.candidate|_rc' | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          xcodebuild -version
          # La configuración de development; en un .xcconfig, // empieza un comentario.
          mkdir -p Config
          xc() { printf '%s = %s\n' "$1" "$(printf '%s' "${!1:-}" | sed 's#//#/$()/#g')"; }
          {
            echo "// Generado por NanoFlow para las pruebas de UI: no lo edites ni lo versiones."
            for v in $(compgen -e | grep -E '^NF_' | grep -v -E '^NF_(TEST_|OUT$|FLOWS$|XCODE_)'); do xc "$v"; done
          } > Config/NanoFlow.xcconfig
          source=(-project "${NF_XCODE_PROJECT}.xcodeproj")
          if [ "$NF_XCODE_WORKSPACE" = "true" ]; then source=(-workspace "${NF_XCODE_PROJECT}.xcworkspace"); fi
          if ! xcodebuild build "${source[@]}" -scheme "$NF_XCODE_PROJECT" -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO; then
            fail "No compiló el esquema ${NF_XCODE_PROJECT} para el simulador: mira el log."
          fi
          app=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app 2>/dev/null | head -n 1)
          [ -n "$app" ] || fail "El build no dejó la app en Build/Products/Debug-iphonesimulator/."
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | last | .udid // empty')
          [ -n "$udid" ] || fail "La imagen de macOS no tiene un simulador de iPhone disponible."
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          echo "Simulador $(xcrun simctl list devices -j | jq -r --arg u "$udid" '.devices[][] | select(.udid == $u) | .name') con la app instalada."

      - name: Pruebas en el simulador (iOS)
        if: steps.flows.outputs.count != '0' && inputs.platform == 'ios'
        shell: bash
        run: '"$RUNNER_TEMP/nf-maestro.sh"'

      # ------------------------------------------------------------- Evidencia
      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "### Pruebas de UI (${{ inputs.platform }})"
            echo
            echo "**$(jq -r '.status' "$NF_OUT/result.json" 2>/dev/null || echo 'setup-failed')** — $(jq -r '.message' "$NF_OUT/result.json" 2>/dev/null || echo 'sin result.json')"
          } >> "$GITHUB_STEP_SUMMARY"
          # La contraseña del usuario de prueba nunca sale en el artifact. Los
          # logs de depuración de Maestro (commands-*.json, maestro.log) la
          # traen en el inputText del login: se reemplaza por *** y el log se
          # conserva, porque dice en qué paso falló cada flujo (doc 53 §15).
          # Se busca tal cual y escapada como en JSON. Un archivo binario que
          # la contenga, o uno en que quedara tras reemplazarla, se quita.
          if [ -n "${NF_TEST_PASSWORD:-}" ]; then
            NF_PW_JSON=$(jq -rn --arg p "$NF_TEST_PASSWORD" '$p | @json | .[1:-1]')
            export NF_PW_JSON
            masked=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if grep -qIF -e "$NF_TEST_PASSWORD" -e "$NF_PW_JSON" -- "$f"; then
                perl -pi -e 's/\Q$ENV{NF_PW_JSON}\E/***/g; s/\Q$ENV{NF_TEST_PASSWORD}\E/***/g' -- "$f"
                masked=$((masked + 1))
              fi
              if grep -qF -e "$NF_TEST_PASSWORD" -e "$NF_PW_JSON" -- "$f"; then
                rm -f -- "$f"
                echo "::warning::Se quitó ${f#$NF_OUT/} del artifact: contenía la contraseña del usuario de prueba."
              fi
            done < <(grep -rlF -e "$NF_TEST_PASSWORD" -e "$NF_PW_JSON" -- "$NF_OUT" 2>/dev/null || true)
            if [ "$masked" != "0" ]; then echo "La contraseña se reemplazó por *** en ${masked} archivos de la salida de depuración."; fi
          fi

      - name: Artifact de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanoflow-ui-tests-${{ inputs.platform }}
          path: ${{ env.NF_OUT }}
          retention-days: 14
          if-no-files-found: warn
