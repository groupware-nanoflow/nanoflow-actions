# Workflow reutilizable de NanoFlow: apply de Terraform del repo de infra de un
# proyecto de AZURE al llegar un push a la rama de un ambiente. Es el hermano de
# terraform-apply.yml (AWS), que no cambia.
#
# Dos jobs: `resolve` lee .nanoflow/infra.json y decide el ambiente de la rama;
# `apply` corre DENTRO del GitHub Environment de ese ambiente. Eso es lo que
# hace que el `sub` del token OIDC sea `…:environment:<env>`, lo único que la
# credencial federada de la identidad de APPLY acepta; y el environment solo
# admite su rama. Se planea de nuevo y se aplica ese plan guardado (nunca
# `-auto-approve` sobre un plan no guardado). El despliegue se informa a
# NanoFlow como cualquier otro.
#
# Un ambiente que NanoFlow destruyó (variable de repo NF_INFRA_DESTROYED_<AMBIENTE>,
# doc 29) no se aplica: el push no lo recrea hasta que se vuelve a construir la
# infraestructura desde NanoFlow.
name: NanoFlow terraform apply (Azure)

on:
  workflow_call:
    inputs:
      api-url:
        description: Base del API de NanoFlow.
        required: true
        type: string
      audience:
        description: Audiencia OIDC de NanoFlow, p. ej. nanoflow-dev.
        required: true
        type: string
      config:
        required: false
        type: string
        default: .nanoflow/infra.json
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      live-logs:
        required: false
        type: boolean
        default: true
    # Los secretos del GitHub Environment del ambiente. Un workflow reutilizable
    # solo ve los secretos que el llamador le pasa (y `secrets: inherit` no cruza
    # organizaciones), así que el repo de infra los pasa todos en uno:
    # `NF_SECRETS: ${{ toJSON(secrets) }}`, que GitHub evalúa en el job que
    # declara el environment. Sin él (repos generados antes) el job no recibe
    # ningún secreto del ambiente, y eso no alcanza para Supabase.
    secrets:
      NF_SECRETS:
        description: toJSON(secrets) del llamador.
        required: false

jobs:
  resolve:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      found: ${{ steps.env.outputs.found }}
      destroyed: ${{ steps.destroyed.outputs.destroyed }}
      environment: ${{ steps.env.outputs.environment }}
      dir: ${{ steps.env.outputs.dir }}
      subscription-id: ${{ steps.env.outputs.subscription-id }}
      tenant-id: ${{ steps.env.outputs.tenant-id }}
      apply-client-id: ${{ steps.env.outputs.apply-client-id }}
      terraform-version: ${{ steps.env.outputs.terraform-version }}
    steps:
      - uses: actions/checkout@v4
      - id: env
        uses: groupware-nanoflow/nanoflow-actions/actions/azure-infra-env@v2
        with:
          branch: ${{ github.ref_name }}
          config: ${{ inputs.config }}
      - id: destroyed
        if: steps.env.outputs.found == 'true'
        uses: groupware-nanoflow/nanoflow-actions/actions/infra-destroyed@v2
        with:
          environment: ${{ steps.env.outputs.environment }}
          vars-json: ${{ toJSON(vars) }}

  apply:
    needs: resolve
    if: needs.resolve.outputs.found == 'true' && needs.resolve.outputs.destroyed != 'true'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ needs.resolve.outputs.environment }}
    # Un apply colgado falla en minutos (y se informa), no a las 6 horas.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    # Un apply por ambiente a la vez, y nunca se cancela uno en curso.
    concurrency:
      group: nanoflow-terraform-azure-apply-${{ github.repository }}-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    steps:
      # Otra vez, ya dentro del grupo de concurrencia: si NanoFlow confirmó una
      # destrucción mientras este apply esperaba, no se recrea nada.
      - name: El ambiente no se está destruyendo
        uses: groupware-nanoflow/nanoflow-actions/actions/infra-destroyed@v2
        with:
          environment: ${{ needs.resolve.outputs.environment }}
          vars-json: ${{ toJSON(vars) }}
          fail: 'true'

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.resolve.outputs.terraform-version }}
          terraform_wrapper: false

      - name: Credenciales de apply
        uses: groupware-nanoflow/nanoflow-actions/actions/azure-oidc@v2
        with:
          client-id: ${{ needs.resolve.outputs.apply-client-id }}
          tenant-id: ${{ needs.resolve.outputs.tenant-id }}
          subscription-id: ${{ needs.resolve.outputs.subscription-id }}

      - name: Preparar el log en vivo
        uses: groupware-nanoflow/nanoflow-actions/actions/log-stream@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          check-run-id: ${{ job.check_run_id }}
          enabled: ${{ inputs.live-logs }}

      - name: Informar el inicio del despliegue
        uses: groupware-nanoflow/nanoflow-actions/actions/report-deployment@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          status: in_progress

      # Cada fase en su paso: si una se cuelga, GitHub muestra cuál. Las corre
      # terraform-run, que no ata el fin del paso a la tubería del log en vivo
      # (un hijo de terraform con la salida heredada colgaba el paso).
      # Proveedores externos (Auth0): secretos del GitHub Environment que el
      # usuario carga en NanoFlow.
      - name: Credenciales de proveedores externos
        uses: groupware-nanoflow/nanoflow-actions/actions/provider-credentials@v2
        with:
          environment: ${{ needs.resolve.outputs.environment }}
          working-directory: ${{ needs.resolve.outputs.dir }}
          mode: apply
          vars-json: ${{ toJSON(vars) }}
          auth0-client-id: ${{ secrets.NF_SECRETS && fromJSON(secrets.NF_SECRETS).AUTH0_CLIENT_ID || '' }}
          auth0-client-secret: ${{ secrets.NF_SECRETS && fromJSON(secrets.NF_SECRETS).AUTH0_CLIENT_SECRET || '' }}
          secrets-json: ${{ secrets.NF_SECRETS || '{}' }}

      - name: Init
        timeout-minutes: 10
        uses: groupware-nanoflow/nanoflow-actions/actions/terraform-run@v2
        with:
          step: init
          working-directory: ${{ needs.resolve.outputs.dir }}
          command: terraform init -input=false -lock-timeout=5m

      - name: Plan
        id: plan
        timeout-minutes: 20
        uses: groupware-nanoflow/nanoflow-actions/actions/terraform-run@v2
        with:
          step: plan
          working-directory: ${{ needs.resolve.outputs.dir }}
          command: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan && terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      - name: Emparejar direcciones
        id: reconcile
        uses: groupware-nanoflow/nanoflow-actions/actions/reconcile-moves@v2
        with:
          plan-json: ${{ runner.temp }}/plan.json
          working-directory: ${{ needs.resolve.outputs.dir }}

      # Se aplica este plan, con los `moved`, y no el primero.
      - name: Plan con los moved
        id: replan
        if: steps.reconcile.outputs.moved != '' && steps.reconcile.outputs.moved != '0'
        timeout-minutes: 20
        uses: groupware-nanoflow/nanoflow-actions/actions/terraform-run@v2
        with:
          step: plan
          working-directory: ${{ needs.resolve.outputs.dir }}
          command: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan && terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      # Con nombres físicos sin emparejar, el apply chocaría a medias: el job
      # falla aquí, antes de tocar nada (Apply queda sin correr).
      - name: Nombres físicos sin emparejar
        id: collisions
        if: steps.reconcile.outputs.collisions != '' && steps.reconcile.outputs.collisions != '0'
        shell: bash
        env:
          NF_MSG: ${{ steps.reconcile.outputs.message }}
        run: |
          echo "::error::${NF_MSG}"
          exit 1

      - name: Apply
        id: apply
        timeout-minutes: 60
        uses: groupware-nanoflow/nanoflow-actions/actions/terraform-run@v2
        with:
          step: apply
          working-directory: ${{ needs.resolve.outputs.dir }}
          command: terraform apply -input=false -lock-timeout=5m -no-color tfplan

      # La URL del frontend, si el blueprint creó uno.
      - name: URL desplegada
        id: url
        timeout-minutes: 2
        working-directory: ${{ needs.resolve.outputs.dir }}
        shell: bash
        run: |
          url=$(terraform output -raw frontend_url 2>/dev/null </dev/null || true)
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+$ ]] || url=''
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # El contrato de plataforma (output nanoflow_contract) va a NanoFlow, que
      # lo escribe como variables NF_* en los repos de aplicación. Solo tras un
      # apply bueno: un apply a medias puede haber dejado outputs viejos.
      - name: Informar el contrato de plataforma
        if: steps.apply.outcome == 'success'
        timeout-minutes: 3
        uses: groupware-nanoflow/nanoflow-actions/actions/report-outputs@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          working-directory: ${{ needs.resolve.outputs.dir }}

      - name: Informar el resultado del despliegue
        if: always()
        uses: groupware-nanoflow/nanoflow-actions/actions/report-deployment@v2
        with:
          api-url: ${{ inputs.api-url }}
          audience: ${{ inputs.audience }}
          status: ${{ job.status == 'success' && 'success' || (job.status == 'cancelled' && 'cancelled' || 'failure') }}
          environment-url: ${{ steps.url.outputs.url }}
          error: ${{ steps.collisions.outcome == 'failure' && 'el plan destruye y vuelve a crear recursos con el mismo nombre físico sin emparejar (no se aplicó nada)' || (steps.apply.outcome == 'failure' && 'terraform apply falló' || '') }}

      - name: Resumen
        if: always()
        shell: bash
        env:
          NF_ENV: ${{ needs.resolve.outputs.environment }}
          NF_URL: ${{ steps.url.outputs.url }}
          NF_OUTCOME: ${{ steps.apply.outcome }}
          NF_MOVED_MD: ${{ steps.reconcile.outputs.summary-file }}
        run: |
          {
            echo "## Terraform apply · ${NF_ENV}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Resultado | ${NF_OUTCOME} |"
            echo "| Rama | ${GITHUB_REF_NAME} |"
            echo "| Commit | ${GITHUB_SHA} |"
            [ -n "$NF_URL" ] && echo "| URL | ${NF_URL} |"
            if [ -n "$NF_MOVED_MD" ] && [ -s "$NF_MOVED_MD" ]; then
              echo ""
              cat "$NF_MOVED_MD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
